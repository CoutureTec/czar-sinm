name: Racional do Cálculo (Exemplo 06)

# Executa exemplos/06_racional_por_codigo/exemplo.py com as credenciais e o
# código informados via formulário: monta o SINMClient a partir do ambiente e
# consulta o racional do cálculo da classificação.
# Respeita SINM_GRANT_TYPE (client_credentials padrão, ou password/ROPC).
# Usuário/senha só são necessários para grant_type=password.
# Senha e client_secret são mascarados nos logs.
#
# Disparo: Actions → "Racional do Cálculo (Exemplo 06)" → Run workflow

on:
  workflow_dispatch:
    inputs:
      sinm_ambiente:
        description: 'Ambiente'
        required: true
        default: 'hml'
        type: choice
        options:
          - hml
          - prd
      sinm_client_id:
        description: 'Client ID Keycloak (CNPJ sem máscara, ex: 41483879000157)'
        required: true
        type: string
      sinm_client_secret:
        description: 'Client Secret Keycloak (chave secreta do client)'
        required: true
        type: string
      codigo:
        description: 'Código da classificação (chaveClassificacaoNM) a consultar'
        required: true
        type: string
      sinm_grant_type:
        description: 'Grant Type (padrão=client_credentials; use password para ROPC)'
        required: false
        default: 'client_credentials'
        type: choice
        options:
          - client_credentials
          - password
      sinm_username:
        description: 'Usuário (email) — obrigatório apenas para grant_type=password'
        required: false
        type: string
      sinm_password:
        description: 'Senha (mascarada nos logs) — obrigatória apenas para grant_type=password'
        required: false
        type: string
      sinm_proxy:
        description: 'Proxy HTTP(S) opcional (ex: http://proxy.cnptia.embrapa.br:3128)'
        required: false
        type: string
      formato_json:
        description: 'Imprimir JSON cru em vez do relatório'
        required: false
        default: false
        type: boolean

jobs:
  racional:
    name: Racional do Cálculo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mascarar dados sensíveis
        run: |
          echo "::add-mask::${{ inputs.sinm_password }}"
          echo "::add-mask::${{ inputs.sinm_client_secret }}"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Consultar racional
        working-directory: exemplos/06_racional_por_codigo
        env:
          SINM_AMBIENTE: ${{ inputs.sinm_ambiente }}
          SINM_CLIENT_ID: ${{ inputs.sinm_client_id }}
          SINM_CLIENT_SECRET: ${{ inputs.sinm_client_secret }}
          SINM_GRANT_TYPE: ${{ inputs.sinm_grant_type }}
          SINM_USERNAME: ${{ inputs.sinm_username }}
          SINM_PASSWORD: ${{ inputs.sinm_password }}
          SINM_PROXY: ${{ inputs.sinm_proxy }}
        run: |
          if [ "${{ inputs.formato_json }}" = "true" ]; then
            python exemplo.py --codigo "${{ inputs.codigo }}" --json
          else
            python exemplo.py --codigo "${{ inputs.codigo }}"
          fi
