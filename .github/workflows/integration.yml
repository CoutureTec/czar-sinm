name: Testes de Integração

# Executa os exemplos (exemplos/exemplo_v1.py e exemplo_v2.py) contra a API
# real (ambiente hml): autenticação, gleba, análise de solo química e física,
# sensoriamento remoto, classificação e racional.
#
# ATENÇÃO: secrets não são repassados em PRs de forks externos — apenas
# para branches do próprio repositório. PRs de forks serão ignorados.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SINM_USERNAME
#   SINM_PASSWORD
#   SINM_CLIENT_ID
#   SINM_CLIENT_SECRET

on:
  pull_request:
    branches: [main]
  # Permite disparar manualmente pelo GitHub Actions UI
  workflow_dispatch:

jobs:
  integration:
    name: Fluxo SiNM contra API hml
    runs-on: ubuntu-latest
    env:
      SINM_AMBIENTE: hml
      SINM_GRANT_TYPE: password
      SINM_USERNAME: ${{ secrets.SINM_USERNAME }}
      SINM_PASSWORD: ${{ secrets.SINM_PASSWORD }}
      SINM_CLIENT_ID: ${{ secrets.SINM_CLIENT_ID }}
      SINM_CLIENT_SECRET: ${{ secrets.SINM_CLIENT_SECRET }}
      SINM_AJUSTAR_DATAS: sim

    steps:
      - uses: actions/checkout@v4

      - name: Verificar se secrets estão disponíveis
        env:
          SECRET: ${{ secrets.SINM_USERNAME }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::Secrets não configurados. Configure SINM_USERNAME, SINM_PASSWORD, SINM_CLIENT_ID e SINM_CLIENT_SECRET em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      # v1 com os dados em JSON e v2 com os mesmos dados em CSV: cobre os dois
      # contratos e as duas fontes. Cada script sai com 1 se alguma etapa falhar.
      - name: "Fluxo /api/v1 · fonte JSON"
        working-directory: exemplos
        run: python exemplo_v1.py --fonte json

      - name: "Fluxo /api/v2 · fonte CSV"
        working-directory: exemplos
        run: python exemplo_v2.py --fonte csv
